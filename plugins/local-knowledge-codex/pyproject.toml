[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-knowledge-codex"
version = "0.2.9"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
knowledge-codex = "local_knowledge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bugdb", "local_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
